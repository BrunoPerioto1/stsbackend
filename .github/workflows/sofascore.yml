# Alimenta sport_events com os proximos 30 dias de jogos.
# Nao roda no Vercel: o plano Hobby tem teto de 60s por funcao e 1 cron/dia,
# e o coletor precisa do fingerprint TLS do wreq pra passar pelo Cloudflare.
name: sofascore

on:
  schedule:
    - cron: '0 6 * * *' # 03:00 BRT
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: jobs/sofascore/requirements.txt
      - run: pip install -r jobs/sofascore/requirements.txt
      - run: python jobs/sofascore/collect.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
