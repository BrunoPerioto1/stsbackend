# Alimenta sport_events com os proximos 30 dias de jogos.
#
# Nao roda no Vercel: o plano Hobby tem teto de 60s por funcao e 1 cron/dia, e o
# coletor precisa do fingerprint TLS do wreq pra passar pelo Cloudflare.
#
# Runner hospedado, sem depender de maquina ligada. O fingerprint resolve o
# "parece um browser", mas o Cloudflare tambem pontua reputacao de IP e a faixa
# da Azure toma 403. Por isso o trafego sai pelo secret PROXY_URL (proxy
# residencial) ou, sem ele, pelo Cloudflare WARP.
name: sofascore

on:
  schedule:
    # Seg e qui, 11:00 BRT. A coleta pega os proximos 30 dias, entao 2x por
    # semana ja cobre.
    - cron: '0 14 * * 1,4'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      PROXY_URL: ${{ secrets.PROXY_URL }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - if: env.PROXY_URL == ''
        uses: ./.github/actions/warp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: jobs/sofascore/requirements.txt
      - run: pip install -r jobs/sofascore/requirements.txt
      - run: python jobs/sofascore/collect.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
