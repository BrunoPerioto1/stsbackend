# Busca o placar dos jogos que ja' terminaram e alimenta event_results.
#
# Companheiro do sofascore.yml: aquele traz os jogos que VAO acontecer, este
# traz o placar dos que JA' aconteceram. Mesma saida de rede (ver abaixo).
#
# Runner hospedado: o IP da Azure toma 403 do Cloudflare do SofaScore, entao o
# trafego sai pelo secret PROXY_URL (proxy residencial) ou, sem ele, pelo WARP.
#
# Nada aqui liquida aposta: o job so' grava placar. Quem propoe resultado e' a
# API (POST /settlement/cron, chamado no fim deste job), e quem decide e' o usuario, na tela de
# conferencia.
name: sofascore-results

on:
  schedule:
    # 3x ao dia (06h, 16h, 22h BRT) pra liquidar jogos encerrados mais cedo.
    # Minuto 17 de proposito: no minuto 0 a fila do GitHub lota e o disparo
    # chegou a atrasar 3-4h. Cron do Actions e' sempre UTC (BRT = UTC-3).
    - cron: '17 9,19 * * *'  # 06h e 16h BRT
    - cron: '17 1 * * *'     # 22h BRT
  workflow_dispatch:
    inputs:
      max_eventos:
        description: 'Teto do lote (10 faz uma rodada curta de conferencia)'
        required: false
        default: '300'
      fatos:
        description: 'Coletar estatisticas/incidentes/escalacao (0 = so placar)'
        required: false
        default: '1'

jobs:
  collect-results:
    runs-on: ubuntu-latest
    env:
      PROXY_URL: ${{ secrets.PROXY_URL }}
      # Usados so' no ultimo passo (calculo das propostas na API).
      API_URL: ${{ secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    # Com a coleta de estatisticas sao 4 requests por evento, nao 1: o lote
    # cheio passa de 80 minutos no intervalo de 3-5s entre requests. Com 25
    # o job era cortado no meio e metade do lote ficava sem placar.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - if: env.PROXY_URL == ''
        uses: ./.github/actions/warp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: jobs/sofascore/requirements.txt
      - run: pip install -r jobs/sofascore/requirements.txt
      - run: python jobs/sofascore/results.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Nos disparos por cron os inputs vem vazios e o job usa os padroes.
          MAX_EVENTOS: ${{ inputs.max_eventos }}
          FATOS: ${{ inputs.fatos }}
      # Placar gravado: a API calcula as propostas de todo mundo e avisa no bot
      # quem tem aposta pronta pra conferir. Continua sem liquidar nada.
      # Sem os secrets API_URL/CRON_SECRET o passo e' pulado, nao falha o job.
      - name: Calcular propostas de conferencia
        if: ${{ always() && env.API_URL != '' && env.CRON_SECRET != '' }}
        run: |
          curl --fail --silent --show-error --max-time 90 \
            -X POST "$API_URL/settlement/cron" \
            -H "Authorization: Bearer $CRON_SECRET"
